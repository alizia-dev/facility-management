<div class="card narrow">
  <h2>Raise a maintenance request</h2>

  <p class="muted">
    {{ auth.organizationName() }} approves anything under
    {{ auth.costThreshold() | currency: 'GBP' }} automatically.
  </p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label for="site">Site</label>
    <select id="site" formControlName="siteId">
      @for (site of sites(); track site.id) {
        <option [value]="site.id">{{ site.name }}</option>
      }
    </select>

    <label for="description">Description</label>
    <textarea id="description" rows="4" formControlName="description"></textarea>

    <label for="cost">Estimated cost (GBP)</label>
    <input id="cost" type="number" step="0.01" min="0" formControlName="estimatedCost" />

    <p class="muted">
      @if (willNeedApproval) {
        This will go to an approver.
      } @else {
        This is below the threshold and will be approved automatically.
      }
    </p>

    <app-form-errors [message]="error()" />

    <button type="submit" [disabled]="form.invalid || busy()">
      {{ busy() ? 'Submitting…' : 'Submit request' }}
    </button>
  </form>
</div>
